name: Refresh circle JSON

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Initialize package.json if missing
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install dependencies
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Refresh JSON files from Playwright export
        id: refresh
        env:
          DOWNLOAD_COOKIE: ${{ secrets.DOWNLOAD_COOKIE }}
        run: node scripts/update-json.mjs

      - name: Verify circle data exists
        id: verify
        if: steps.refresh.outcome == 'success'
        run: |
          found=0
          for f in data/*.json; do
            [ "$(basename "$f")" = "clubs.json" ] && continue
            if grep -q '"monthly_rank"' "$f" 2>/dev/null; then
              found=$((found + 1))
            fi
          done

          echo "circles_found=$found" >> "$GITHUB_OUTPUT"

          if [ "$found" -eq 0 ]; then
            echo "::warning::No circle files with monthly_rank found — skipping rank tracker"
          else
            echo "Found $found circle file(s) with rank data"
          fi

      - name: Update rank history
        if: steps.verify.outcome == 'success' && steps.verify.outputs.circles_found != '0'
        run: node scripts/track_ranks.js

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json data/club_rank_history/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Refresh circle JSON"
          git push
