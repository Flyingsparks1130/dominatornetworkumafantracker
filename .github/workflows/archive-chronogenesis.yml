name: Archive completed Chronogenesis month

on:
  schedule:
    - cron: "20 15,16,17 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional archive month in YYYY-MM format"
        required: false
        type: string
      source_ref:
        description: "Required historical Git ref when backfilling an older month"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: chronogenesis-data
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Ensure archive directories exist
        run: |
          mkdir -p data/chronogenesis/archive
          mkdir -p data/chronogenesis/archive/config

      - name: Archive completed Chronogenesis month
        id: archive
        continue-on-error: true
        env:
          ARCHIVE_MONTH: ${{ inputs.month || '' }}
          ARCHIVE_SOURCE_REF: ${{ inputs.source_ref || '' }}
        run: |
          args=()
          if [ -n "$ARCHIVE_MONTH" ]; then
            args+=(--month "$ARCHIVE_MONTH")
          fi
          if [ -n "$ARCHIVE_SOURCE_REF" ]; then
            args+=(--source-ref "$ARCHIVE_SOURCE_REF")
          fi
          node scripts/archive-chronogenesis-complete-month.mjs "${args[@]}"

      - name: Commit and push archive files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/chronogenesis/archive/*.json data/chronogenesis/archive/config/*.json || true

          if git diff --cached --quiet; then
            echo "No archive changes to commit"
            exit 0
          fi

          git commit -m "Archive completed Chronogenesis month"

          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              exit 1
            fi
            if git push; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "Could not push archive commit after 3 attempts"
          exit 1

      - name: Fail when expected archives are incomplete
        if: steps.archive.outcome == 'failure'
        run: |
          echo "One or more expected club archives were not completed. See the archive step for details."
          exit 1
