name: Update Chronogenesis Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chronogenesis-data
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-chronogenesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Ensure output directories exist
        run: |
          mkdir -p data/chronogenesis
          mkdir -p data/chronogenesis/archive/config
          mkdir -p scripts/debug

      - name: Run Chronogenesis updater
        id: update
        continue-on-error: true
        env:
          CHRONOGENESIS_API_KEY: ${{ secrets.CHRONOGENESIS_API_KEY }}
          CHRONOGENESIS_USER_AGENT: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36
        run: node scripts/update-chronogenesis.mjs

      - name: Snapshot current Chronogenesis frontend config
        if: always()
        run: node scripts/snapshot-chronogenesis-config.mjs

      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/chronogenesis/*.json data/chronogenesis/archive/config/*.json scripts/debug || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Chronogenesis data"

          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              exit 1
            fi
            if git push; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "Could not push Chronogenesis update after 3 attempts"
          exit 1

      - name: Fail when any club update failed
        if: steps.update.outcome == 'failure'
        run: |
          echo "One or more club updates failed after retries. Successful club data was still committed."
          exit 1
