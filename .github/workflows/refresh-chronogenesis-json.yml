name: Update Chronogenesis Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-chronogenesis
  cancel-in-progress: false

jobs:
  update-chronogenesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Ensure output directories exist
        run: |
          mkdir -p data/chronogenesis
          mkdir -p data/chronogenesis/archive
          mkdir -p scripts/debug

      - name: Run Chronogenesis updater
        env:
          CHRONOGENESIS_API_KEY: ${{ secrets.CHRONOGENESIS_API_KEY }}
          CHRONOGENESIS_USER_AGENT: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36
        run: node scripts/update-chronogenesis.mjs

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/chronogenesis/*.json scripts/debug || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Chronogenesis data"
          git push
